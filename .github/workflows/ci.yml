name: CI

# Checks every push and pull request: formatting, that the module and both
# examples validate (no Azure sign-in, no state), the module tests with mock
# providers (tests/), and that the Reference section
# of README.md matches what terraform-docs writes. Every action is pinned by
# commit SHA with its version as a comment.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Validate the module and the examples
        run: |
          for dir in . examples/default examples/existing-sso; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: Module tests (mock providers)
        run: terraform test

  docs:
    name: README reference is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: .
          config-file: .terraform-docs.yml
          output-method: inject
          fail-on-diff: true

  markdown:
    name: Markdown style and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-concurrency 8 --exclude "<|example\.(com|org)|contoso|azurewebsites\.net" "**/*.md"
          fail: true

  iac:
    name: IaC scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # results in the Security tab
    env:
      # The official image pinned by digest (0.76.1), like the app's docker.yml;
      # trivy-action is not used since its tags were hijacked in March 2026.
      TRIVY: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Misconfigurations (HIGH and CRITICAL fail, accepted ones in .trivyignore.yaml)
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY" \
            config . --skip-dirs tests --ignorefile .trivyignore.yaml --severity HIGH,CRITICAL --exit-code 1
      - name: All findings, for the Security tab
        if: always() && github.event_name != 'pull_request'
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY" \
            config . --skip-dirs tests --ignorefile .trivyignore.yaml --format sarif --output trivy.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-iac
